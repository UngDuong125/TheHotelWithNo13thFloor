<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><rect x="24" y="24" width="976" height="976" rx="3" fill="#dfd0ae" stroke="#8e7952" stroke-width="3"/><path d="M65 140H959M65 920H959" stroke="#806b48" stroke-width="2"/><text x="70" y="100" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#302b23">LÁ THƯ CHƯA GỬI</text><text x="72" y="185" font-family="Arial,sans-serif" font-size="24" fill="#302b23">Châu của mẹ,</text><text x="72" y="228" font-family="Arial,sans-serif" font-size="24" fill="#302b23"></text><text x="72" y="271" font-family="Arial,sans-serif" font-size="24" fill="#302b23">Nếu con đọc được lá thư này, hãy nhớ:</text><text x="72" y="314" font-family="Arial,sans-serif" font-size="24" fill="#302b23">mẹ chưa bao giờ muốn bỏ con lại.</text><text x="72" y="357" font-family="Arial,sans-serif" font-size="24" fill="#302b23"></text><text x="72" y="400" font-family="Arial,sans-serif" font-size="24" fill="#302b23">Có những cánh cửa người ta khóa để giấu sự thật.</text><text x="72" y="443" font-family="Arial,sans-serif" font-size="24" fill="#302b23">Mẹ đã nghe thấy họ nói. Mẹ đã giữ lại cuộn băng.</text><text x="72" y="486" font-family="Arial,sans-serif" font-size="24" fill="#302b23"></text><text x="72" y="529" font-family="Arial,sans-serif" font-size="24" fill="#302b23">Mẹ sẽ tìm cách mở cửa.</text><text x="72" y="572" font-family="Arial,sans-serif" font-size="24" fill="#302b23">Con hãy đi theo ánh đèn và đừng quay lại.</text><text x="72" y="615" font-family="Arial,sans-serif" font-size="24" fill="#302b23"></text><text x="72" y="658" font-family="Arial,sans-serif" font-size="24" fill="#302b23">Mẹ thương con.</text><text x="72" y="701" font-family="Arial,sans-serif" font-size="24" fill="#302b23">Thu Hà</text></svg>