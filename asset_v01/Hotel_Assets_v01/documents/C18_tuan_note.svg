<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><rect x="24" y="24" width="976" height="976" rx="3" fill="#dfd0ae" stroke="#8e7952" stroke-width="3"/><path d="M65 140H959M65 920H959" stroke="#806b48" stroke-width="2"/><text x="70" y="100" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#302b23">MẨU GIẤY CỦA TUẤN</text><text x="72" y="185" font-family="Arial,sans-serif" font-size="24" fill="#302b23">Em thấy thang máy tự chạy lúc 00:13.</text><text x="72" y="228" font-family="Arial,sans-serif" font-size="24" fill="#302b23">Không có ai đứng ở bảng điều khiển.</text><text x="72" y="271" font-family="Arial,sans-serif" font-size="24" fill="#302b23"></text><text x="72" y="314" font-family="Arial,sans-serif" font-size="24" fill="#302b23">Cái nút đó chỉ sáng một lúc thôi.</text><text x="72" y="357" font-family="Arial,sans-serif" font-size="24" fill="#302b23">Đừng nói với chị Hạnh là em kể.</text><text x="72" y="400" font-family="Arial,sans-serif" font-size="24" fill="#302b23"></text><text x="72" y="443" font-family="Arial,sans-serif" font-size="24" fill="#302b23">Tuấn</text></svg>